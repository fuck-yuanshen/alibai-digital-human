<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>以太李白</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #fff;
            background: #050505;
        }

        .entry {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 6vh 7vw;
            isolation: isolate;
        }

        .entry::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(90deg, rgba(0, 0, 0, 0.78) 0%, rgba(0, 0, 0, 0.42) 42%, rgba(0, 0, 0, 0.08) 100%),
                url("/data/wav2lip_avatar_wzj2cjl/full_imgs/00000000.png");
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .entry::after {
            content: "";
            position: absolute;
            inset: auto 0 0;
            height: 28vh;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.72), transparent);
            z-index: -1;
        }

        .content {
            width: min(540px, 100%);
        }

        .eyebrow {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.74);
            margin-bottom: 0.9rem;
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6.5rem);
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0;
            margin-bottom: 1.25rem;
        }

        .copy {
            font-size: clamp(1rem, 2vw, 1.22rem);
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.86);
            margin-bottom: 2rem;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .primary {
            border: 0;
            background: #f6f1e7;
            color: #1d1a16;
            padding: 0.95rem 1.35rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            min-height: 48px;
        }

        .primary:hover {
            background: #fff;
        }

        .hint {
            color: rgba(255, 255, 255, 0.68);
            font-size: 0.92rem;
        }

        .settings-toggle {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(0, 0, 0, 0.42);
            color: #fff;
            border-radius: 8px;
            padding: 0.7rem 0.9rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .settings-panel {
            position: fixed;
            top: 4.5rem;
            right: 1.25rem;
            width: min(440px, calc(100vw - 2.5rem));
            padding: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(20, 20, 20, 0.92);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            display: none;
            z-index: 5;
        }

        .settings-panel.open { display: block; }
        .settings-panel h2 { font-size: 1.05rem; margin-bottom: 0.65rem; }
        .settings-panel p { color: rgba(255, 255, 255, 0.68); font-size: 0.82rem; line-height: 1.5; }
        .settings-panel textarea {
            width: 100%;
            min-height: 150px;
            margin: 0.65rem 0;
            padding: 0.7rem;
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 6px;
            background: #111;
            color: #fff;
            resize: vertical;
            font: inherit;
            line-height: 1.5;
        }

        .settings-actions { display: flex; gap: 0.6rem; align-items: center; }
        .settings-actions button { border: 0; border-radius: 6px; padding: 0.6rem 0.85rem; cursor: pointer; }
        #savePrompt { background: #f6f1e7; color: #1d1a16; font-weight: 700; }
        #promptStatus { color: rgba(255, 255, 255, 0.75); font-size: 0.8rem; }

        @media (max-width: 720px) {
            .entry {
                align-items: flex-end;
                padding: 8vh 1.25rem;
            }

            .entry::before {
                background-position: 58% center;
            }

            .primary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <button class="settings-toggle" type="button" onclick="togglePromptPanel()">
        <i class="bi bi-sliders"></i> 系统提示词
    </button>
    <aside id="settingsPanel" class="settings-panel" aria-label="系统提示词设置">
        <h2>自定义系统提示词</h2>
        <p>提示词会保存到当前程序目录的 <code>settings.json</code>，并用于下一次对话。</p>
        <textarea id="systemPrompt" maxlength="12000" placeholder="输入数字人的角色、语气和回答规则"></textarea>
        <div class="settings-actions">
            <button id="savePrompt" type="button" onclick="saveSystemPrompt()">保存</button>
            <span id="promptStatus"></span>
        </div>
    </aside>
    <main class="entry">
        <section class="content">
            <div class="eyebrow">AI Digital Human</div>
            <h1>以太李白</h1>
            <p class="copy">跨越历史长河，与虚拟李白即时对话。进入后点击开始，浏览器会获得一次明确的用户操作，语音播放会更稳定。</p>
            <div class="actions">
                <button class="primary" onclick="location.href='talk.html?avatar=ai_libai'">
                    <i class="bi bi-play-fill"></i>
                    开始对话
                </button>
                <span class="hint">建议使用 Chrome 或 Edge</span>
            </div>
        </section>
    </main>
    <script>
        const promptPanel = document.getElementById('settingsPanel');
        const promptInput = document.getElementById('systemPrompt');
        const promptStatus = document.getElementById('promptStatus');

        function togglePromptPanel() {
            promptPanel.classList.toggle('open');
            if (promptPanel.classList.contains('open') && !promptInput.value) loadSystemPrompt();
        }

        async function loadSystemPrompt() {
            promptStatus.textContent = '读取中...';
            try {
                const response = await fetch('/api/settings/system-prompt');
                const result = await response.json();
                if (result.code === 0) promptInput.value = result.data.system_prompt || '';
                promptStatus.textContent = '';
            } catch (error) {
                promptStatus.textContent = '读取失败';
            }
        }

        async function saveSystemPrompt() {
            const value = promptInput.value.trim();
            if (!value) { promptStatus.textContent = '提示词不能为空'; return; }
            promptStatus.textContent = '保存中...';
            try {
                const response = await fetch('/api/settings/system-prompt', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({system_prompt: value})
                });
                const result = await response.json();
                promptStatus.textContent = result.code === 0 ? '已保存' : (result.msg || '保存失败');
            } catch (error) {
                promptStatus.textContent = '保存失败';
            }
        }
    </script>
</body>
</html>
